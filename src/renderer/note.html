<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Note</title>
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <div class="note" id="note" data-color="yellow" data-mode="type">
    <header class="bar">
      <input class="title" id="title" spellcheck="false" maxlength="80" aria-label="Note title">
      <div class="tools">
        <button class="icon on-hover" id="colorBtn" title="Color" aria-label="Change color">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>
        </button>
        <button class="icon on-hover" id="pinBtn" title="Keep on top" aria-label="Keep on top" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 1.8l4.2 4.2-1.6.4-2.3 2.3.3 3-1.2 1.2L6.7 10 3 13.7 2.3 13 6 9.3 3.1 6.6l1.2-1.2 3 .3 2.3-2.3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
        <button class="chip" id="modeBtn" title="Switch mode (Ctrl+D)">
          <span id="modeLabel">Draw</span>
          <svg id="iconDraw" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.5 11.3V13.5h2.2l7-7-2.2-2.2zm10.6-6.1a.6.6 0 000-.9l-1.4-1.4a.6.6 0 00-.9 0l-1 1 2.3 2.3z"/></svg>
          <svg id="iconType" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 3h10v2.6h-1.4V4.5H9v8h1.3V14H5.7v-1.5H7v-8H4.4v1.1H3z"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon" id="closeBtn" title="Close note (Ctrl+W)" aria-label="Close note">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="palette" id="palette" hidden>
      <button data-color="yellow" title="Yellow"></button>
      <button data-color="blue" title="Blue"></button>
      <button data-color="green" title="Green"></button>
      <button data-color="pink" title="Pink"></button>
      <button data-color="purple" title="Purple"></button>
      <button data-color="gray" title="Gray"></button>
    </div>

    <main class="body">
      <textarea id="text" placeholder="Type something…" spellcheck="true"></textarea>
      <canvas id="ink"></canvas>
    </main>

    <div class="grip" id="grip" title="Resize">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M11 4L4 11M11 8L8 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>
  </div>
  <script src="note.js"></script>
</body>
</html>
