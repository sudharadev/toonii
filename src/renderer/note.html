<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Note</title>
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <!-- One icon set: 24px grid, 2px rounded strokes (Lucide-style, ISC). -->
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 6.81a2.82 2.82 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21M22 21H7M5 11l9 9"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-bold" viewBox="0 0 24 24"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></symbol>
      <symbol id="i-italic" viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5M15 4 9 20"/></symbol>
      <symbol id="i-underline" viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 12 0V4M4 20h16"/></symbol>
      <symbol id="i-strike" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h.01M3 12h.01M3 18h.01M8 6h13M8 12h13M8 18h13"/></symbol>
      <symbol id="i-clear-format" viewBox="0 0 24 24"><path d="M4 7V4h16v3M5 20h6M13 4 8 20M15 15l5 5M20 15l-5 5"/></symbol>
      <symbol id="i-smaller" viewBox="0 0 24 24"><path d="M3 18 8.5 5 14 18M5 14h7M16 12h6"/></symbol>
      <symbol id="i-larger" viewBox="0 0 24 24"><path d="M3 18 8.5 5 14 18M5 14h7M16 12h6M19 9v6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
      <symbol id="i-checklist" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/></symbol>
    </defs>
  </svg>

  <div class="note" id="note" data-color="yellow" data-mode="type">
    <header class="bar" id="bar">
      <span class="dot" aria-hidden="true"></span>
      <input class="title" id="title" spellcheck="false" maxlength="80" aria-label="Note title">
      <div class="tools">
        <button class="icon on-hover" id="styleBtn" title="Color & tilt" aria-label="Color and tilt"><svg class="i"><use href="#i-palette"/></svg></button>
        <button class="icon on-hover" id="pinBtn" title="Keep on top" aria-label="Keep on top" aria-pressed="false"><svg class="i"><use href="#i-pin"/></svg></button>
        <button class="chip" id="modeBtn">
          <span id="modeLabel">Draw</span>
          <svg class="i" id="modeIcon"><use href="#i-pencil"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon" id="closeBtn" title="Close note (Ctrl+W)" aria-label="Close note"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <div class="pop style-pop" id="stylePop" hidden>
      <div class="pop-label">Style · all notes</div>
      <div class="themes" id="themes" role="radiogroup" aria-label="Style for all notes">
        <button data-theme-id="aura" role="radio"><i class="tp tp-aura"></i>Aura</button>
        <button data-theme-id="minimal" role="radio"><i class="tp tp-minimal"></i>Minimal</button>
        <button data-theme-id="midnight" role="radio"><i class="tp tp-midnight"></i>Midnight</button>
        <button data-theme-id="classic" role="radio"><i class="tp tp-classic"></i>Classic</button>
      </div>
      <div class="pop-label">Color</div>
      <div class="swatches" role="radiogroup" aria-label="Color">
        <button data-color="yellow" title="Yellow" role="radio"></button>
        <button data-color="blue" title="Blue" role="radio"></button>
        <button data-color="green" title="Green" role="radio"></button>
        <button data-color="pink" title="Pink" role="radio"></button>
        <button data-color="purple" title="Purple" role="radio"></button>
        <button data-color="gray" title="Gray" role="radio"></button>
      </div>
      <div class="pop-label">Tilt</div>
      <div class="tilt-row">
        <svg class="i"><use href="#i-rotate"/></svg>
        <input type="range" id="tilt" min="-5" max="5" step="0.5" value="0" aria-label="Tilt">
        <button class="icon sm" id="tiltReset" title="Straighten">0°</button>
      </div>
    </div>

    <main class="body" id="body">
      <div class="editor" id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" data-placeholder="Type something…"></div>
      <canvas id="ink"></canvas>
      <div class="draw-tools" id="drawTools" role="toolbar" aria-label="Drawing tools">
        <button class="icon" id="penBtn" title="Pen (P)" aria-pressed="true"><svg class="i"><use href="#i-pencil"/></svg></button>
        <button class="icon" id="eraserBtn" title="Eraser (E)" aria-pressed="false"><svg class="i"><use href="#i-eraser"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon" id="undoBtn" title="Undo (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="icon" id="clearBtn" title="Clear drawing"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
    </main>

    <div class="grip" id="grip" title="Resize">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M11 4 4 11M11 8l-3 3"/></svg>
    </div>
  </div>

  <!-- Floating format toolbar: outside .note so it never rotates. -->
  <div class="format" id="format" role="toolbar" aria-label="Text formatting" hidden>
    <div class="row">
      <div class="stepper" title="Font size">
        <button class="step" data-size-step="-1" aria-label="Smaller"><svg class="i"><use href="#i-minus"/></svg></button>
        <input id="sizeInput" inputmode="numeric" maxlength="3" aria-label="Font size" spellcheck="false">
        <button class="step" data-size-step="1" aria-label="Larger"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <span class="sep"></span>
      <button class="icon" data-cmd="bold" title="Bold (Ctrl+B)"><svg class="i"><use href="#i-bold"/></svg></button>
      <button class="icon" data-cmd="italic" title="Italic (Ctrl+I)"><svg class="i"><use href="#i-italic"/></svg></button>
      <button class="icon" data-cmd="underline" title="Underline (Ctrl+U)"><svg class="i"><use href="#i-underline"/></svg></button>
      <button class="icon" data-cmd="strikeThrough" title="Strikethrough"><svg class="i"><use href="#i-strike"/></svg></button>
      <span class="sep"></span>
      <button class="icon" id="bulletBtn" title="Bullet list (type - then space)"><svg class="i"><use href="#i-list"/></svg></button>
      <button class="icon" id="checkBtn" title="Checklist (type [] then space)"><svg class="i"><use href="#i-checklist"/></svg></button>
      <span class="sep"></span>
      <button class="icon more-btn" id="moreBtn" title="Font, color, clear" aria-expanded="false"><span class="aa">Aa</span></button>
    </div>
    <div class="more" id="more" hidden>
      <div class="fonts">
        <button data-font="sans">Sans</button>
        <button data-font="serif">Serif</button>
        <button data-font="mono">Mono</button>
        <button data-font="hand">Hand</button>
        <button data-font="marker">Marker</button>
      </div>
      <div class="colors">
        <button data-tc="" title="Default color"></button>
        <button data-tc="accent" title="Note color"></button>
        <button data-tc="red" title="Red"></button>
        <button data-tc="orange" title="Orange"></button>
        <button data-tc="green" title="Green"></button>
        <button data-tc="blue" title="Blue"></button>
        <button data-tc="purple" title="Purple"></button>
        <span class="grow"></span>
        <button class="icon" id="clearFormat" title="Clear formatting"><svg class="i"><use href="#i-clear-format"/></svg></button>
      </div>
    </div>
  </div>

  <script src="note.js"></script>
</body>
</html>
